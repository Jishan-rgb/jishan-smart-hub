<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Jishan Smart Hub</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<section class="login-page">

<div class="service-card login-box">

<h2>Jishan Smart Hub</h2>

<p>Login / Create Account</p>


<input 
type="text"
id="name"
placeholder="Full Name">


<input 
type="email"
id="email"
placeholder="Email Address">


<input 
type="password"
id="password"
placeholder="Password">


<input 
type="tel"
id="phone"
placeholder="Mobile Number">


<button class="btn" onclick="signup()">
Create Account
</button>


<button class="btn2" onclick="login()">
Login
</button>


<p id="message"></p>


</div>

</section>


<script type="module" src="auth.js"></script>

</body>

</html>
